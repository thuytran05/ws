/person_tracking/person_tracker:
  ros__parameters:
    image_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    info_topic: /camera/color/camera_info
    model: yolo26n-pose.pt
    device: auto
    imgsz: 640
    conf: 0.35
    keypoint_conf: 0.50
    gesture_seconds: 2.0
    gesture_gap_seconds: 0.75
    sync_slop: 0.06
    max_capture_age: 0.40
    stream_timeout: 0.40

/person_tracking/person_follower:
  ros__parameters:
    desired_distance: 1.50
    distance_deadband: 0.10
    angle_deadband: 0.05
    kp_distance: 0.20
    kp_yaw: 0.45
    max_speed: 0.10
    max_yaw: 0.20
    max_accel: 0.10
    max_yaw_accel: 0.30
    timeout: 0.40
    max_capture_age: 0.40
    expected_frame: camera_color_optical_frame
